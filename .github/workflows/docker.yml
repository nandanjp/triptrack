# Builds the image and pins its tag into the chart. That commit is the CD trigger:
# a code-only change produces no manifest diff, so without it Argo CD has nothing
# to sync.
name: Docker

on:
  push:
    branches: [main]
    # Chart- or docs-only changes need no image, and this stops the tag commit
    # below from queueing another build.
    paths-ignore:
      - "charts/**"
      - "argocd/**"
      - "**.md"
  workflow_dispatch:

# Two builds racing to write image.tag would pin whichever finished last.
concurrency:
  group: docker
  cancel-in-progress: false

jobs:
  build-push:
    name: Build, Push & Pin
    runs-on: ubuntu-latest
    permissions:
      # To push the image-tag commit, which is the CD trigger.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # The branch, not a detached HEAD, so the commit has somewhere to land.
          ref: ${{ github.ref_name }}

      - name: Resolve image tag
        id: tag
        # Derived once and reused, so the deployed tag is provably the built one.
        run: echo "sha=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: nandanjp
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          # The node is x86_64; the dev machine is not.
          platforms: linux/amd64
          push: true
          # Explicit rather than docker/metadata-action, which has silently failed
          # to publish `latest`.
          tags: |
            nandanjp/triptrack:${{ steps.tag.outputs.sha }}
            nandanjp/triptrack:latest
          build-args: |
            VERSION=${{ steps.tag.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin the new image in the chart
        # GITHUB_TOKEN pushes do not trigger `on: push`, so this cannot recurse.
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.sha }}"
          CHART=charts/triptrack/values.yaml

          sed -i "s|^  tag: .*|  tag: ${TAG}|" "$CHART"

          # Fail loudly rather than mangling the chart if that key moves or a
          # second `tag:` appears at the same indent.
          pinned=$(grep -c "^  tag: ${TAG}$" "$CHART" || true)
          if [ "$pinned" != "1" ]; then
            echo "::error::expected exactly one pinned tag line, found ${pinned}"
            exit 1
          fi

          if git diff --quiet -- "$CHART"; then
            echo "Chart already pins ${TAG}."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CHART"
          git commit -m "deploy: pin triptrack to ${TAG} [skip ci]"

          # Another push may have landed while the image was building.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${{ github.ref_name }}"; then exit 0; fi
            git pull --rebase --autostash origin "${{ github.ref_name }}"
          done
          echo "::error::could not push image pin after 3 attempts"
          exit 1
